[package]
name = "studio-update"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Studio's updater in Rust: a signed feed (Ed25519), a background download and a swap on restart."

[dependencies]
studio-net = { path = "../net" }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
