[package]
name = "studio-vector"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shape layers for Zornov: paths, booleans, trim paths, repeaters, path modifiers, gradient fills and strokes, dashes and morphing, drawn by Zornov's vector rasterizer."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
studio-vector-raster = { path = "../vector-raster", default-features = false }
i_overlay = "9"
studio-model = { path = "../../project/model" }
studio-morph = { path = "../../picture/morph" }
