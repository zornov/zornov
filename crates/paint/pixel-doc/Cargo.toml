[package]
name = "studio-pixel-doc"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
autotests = false
autobenches = false
autoexamples = false

# Vendored: the upstream test suites stay in the tree (run them with
# `cargo test -p <crate> --lib`; the tests/ folders need autotests back on) but are not part
# of Zornov's workspace test run.
[lib]
test = false
doctest = false

[dependencies]
studio-pixel-geom = { path = "../pixel-geom" }
studio-pixel-color = { path = "../pixel-color" }
studio-pixel-raster = { path = "../pixel-raster" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1" }
