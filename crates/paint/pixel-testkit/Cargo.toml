[package]
name = "studio-pixel-testkit"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
autotests = false
autobenches = false
autoexamples = false

# Vendored: the upstream test suites stay in the tree (run them with
# `cargo test -p <crate> --lib`; the tests/ folders need autotests back on) but are not part
# of Zornov's workspace test run.
[lib]
test = false
doctest = false

[dependencies]
serde_json = { version = "1" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# In-process resident memory for the benchmarks (`perf`; MIT OR Apache-2.0). `always_use_statm`:
# on Linux read /proc/self/statm, not /proc/self/smaps, which walks every mapping under the mmap
# lock and made the 2 ms sampler thread a fifth of a large bench's CPU time.
memory-stats = { version = "1.2", features = ["always_use_statm"] }
