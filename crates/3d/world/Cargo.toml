[package]
name = "studio-world"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Walkable 3D worlds: terrain heightfields with sculpting and paint layers, instanced scattering, culling and levels of detail, a first/third-person character controller with collision, walk recording into smoothed camera paths, and a builder that makes a world from a description."

[dependencies]
studio-mesh = { path = "../mesh" }
studio-modeling = { path = "../modeling" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
