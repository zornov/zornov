[package]
name = "studio-live"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Capture and live production for Studio: recording, voice-over, teleprompter, vision mixer, RTMP and SRT streaming, card ingest with verified copies, audio sync."

[dependencies]
studio-encode = { path = "../encode" }
studio-audio = { path = "../../sound/audio" }
studio-sound = { path = "../../sound/sound" }
studio-h264 = { path = "../../codecs/h264" }
studio-text = { path = "../../picture/text" }
studio-colour = { path = "../../picture/colour" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
studio-mp4 = { path = "../mp4" }

# Cameras, screens and windows on macOS go through AVFoundation and
# ScreenCaptureKit, reached by the Objective-C runtime.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
