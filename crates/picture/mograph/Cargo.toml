[package]
name = "studio-mograph"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Motion graphics templates for Studio: lower thirds, titles, callouts, calls to action, transitions, infographics and charts animated from data, each with controls to fill in."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
studio-text = { path = "../text" }
studio-vector = { path = "../../vector/vector" }
