[package]
name = "studio-text"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Text shaping, layout, styling, templates and captions for Zornov"

[dependencies]
studio-paths = { path = "../../project/paths" }
studio-colour = { path = "../colour" }
rustybuzz = "0.20"
swash = "0.2"
zeno = "0.3"
fontdb = { version = "0.23", default-features = false, features = ["std", "fs"] }
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
unicode-script = "0.5"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
