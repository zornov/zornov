[package]
name = "studio-fx"
description = "Zornov effects, transitions, motion presets, speed ramps, stabilisation and tracking"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
studio-media = { path = "../../media/media" }
naga = { version = "26", features = ["wgsl-in"] }
