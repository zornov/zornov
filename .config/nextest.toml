# cargo nextest runs each test in its own process, so a test that crashes
# the process (a driver fault, a stack overflow) fails alone and by name,
# instead of taking the whole test binary and every result after it down.
# CI uses the `ci` profile: `cargo nextest run --profile ci`.

[profile.ci]
# Run everything and report every failure, not just the first.
fail-fast = false
# Print a failure's output when it happens and again in the summary.
failure-output = "immediate-final"
# A test past a minute is reported as slow; past ten it is stopped, so a
# hang costs ten minutes, not the job's whole timeout.
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci.junit]
# target/nextest/ci/junit.xml, uploaded by CI.
path = "junit.xml"
