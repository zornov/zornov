# Zornov release configuration, read by `cargo xtask` and compiled into the app.
# Nothing here is secret. Each value can be overridden when the app runs
# (STUDIO_UPDATE_URL, STUDIO_UPDATE_PUBKEY, STUDIO_CRASH_ENDPOINT) or when
# `cargo xtask` runs (the same names, plus STUDIO_UPDATE_BASE_URL).
#
# feed_url        where the signed update feed lives (https). For GitHub
#                 Releases, the latest release's asset:
#                 https://github.com/OWNER/REPO/releases/latest/download/feed.json
#                 (`cargo xtask feed` then points each archive at its own
#                 tagged release, vX.Y.Z). Any static HTTPS host works too.
#                 Empty: the app never checks for updates.
# public_key      the Ed25519 public key (64 hex characters) from
#                 `cargo xtask update-key`. Empty: updates are refused.
# crash_endpoint  where a crash report is sent, only if the person agrees.
#                 Empty: reports stay on this computer.
feed_url = https://github.com/zornov/zornov/releases/latest/download/feed.json
public_key = 55cc3001f11c6d06b5b183dc9e2944daacaf4ebcf07be368b2b422cf0c431a90
crash_endpoint =
