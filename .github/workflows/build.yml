name: build

# Pull requests into main and pushes to main; nothing on other branches, so a
# Dependabot branch runs once (as its pull request), not twice. macOS is not
# built here at all: it is built, tested and signed by hand on a Mac
# (cargo xtask release-mac), and its disk image is attached to releases by hand.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its run in progress. Runs on main
# finish (a newer one waits), because only main saves the build caches: if
# each push cancelled the last, no run would ever save one and every build
# would start cold.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The free runners for a public repository have no limit on minutes but 10 GB
# of cache for the whole repository and about 14 GB of free disk on Linux.
# These keep the builds inside both: no incremental files (CI never rebuilds
# in place) and no debug info in test builds.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  changes:
    # Decides inside the run whether code changed, so a change to documentation
    # only skips the builds while ci-ok still reports (a path filter on the
    # trigger would leave the required check waiting forever).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changed files
        id: files
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then range="$PR_BASE...$PR_HEAD"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..$AFTER"
          else echo "code=true" >> "$GITHUB_OUTPUT"; echo "no range: building everything"; exit 0; fi
          files=$(git diff --name-only "$range")
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '(\.md$|^docs/|^LICENSE|^NOTICE$|^\.github/ISSUE_TEMPLATE/)'; then
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "documentation only: the builds are skipped"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  deny:
    # Licences, advisories, bans and sources (deny.toml).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  workflows:
    # The workflow files and the Linux image: injection through untrusted text,
    # risky triggers, over-broad tokens and credential leaks (zizmor), and
    # mistakes in syntax and expressions (actionlint).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        # As v6 did: uv from GitHub Releases, and a pruned cache.
        with:
          download-from-astral-mirror: false
          prune-cache: true
      - name: zizmor
        run: uvx zizmor==1.31.1 --min-severity medium --format github .github/workflows
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < docker/Dockerfile

  assets:
    # Every committed picture, video, sound, font, plugin and fixture must
    # match assets.lock (cargo xtask assets-lock updates it on purpose).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.0"
      - run: cargo xtask assets-check

  windows:
    # Windows builds and tests natively; it is the one system the maintainers
    # cannot run at their desks.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        # One cache per job, saved by main only: pull requests restore it
        # without writing their own, which would push main's out of the 10 GB.
        with:
          shared-key: windows-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Test
        run: cargo test --release --workspace
      - name: Tests left the test data untouched
        run: cargo xtask assets-check
      - name: Package
        run: cargo xtask package-windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zornov-Windows
          path: dist/*.zip

  linux:
    # Linux builds and tests in the image from docker/Dockerfile: the same
    # environment the dev container gives contributors. (Windows builds natively
    # above; containers only run Linux; macOS is built by hand.)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Make room
        # The image and an optimised build of the workspace do not fit in the
        # runner's free disk; these preinstalled toolchains are not used here.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Build the image
        run: docker build -t zornov-linux docker
      - name: Test, check the test data, package
        run: |
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/cache/home -e CARGO_TARGET_DIR=/work/target \
            -e CARGO_INCREMENTAL -e CARGO_PROFILE_DEV_DEBUG -e CARGO_PROFILE_TEST_DEBUG -e CARGO_TERM_COLOR \
            -v "$PWD:/work" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cargo/git:/usr/local/cargo/git" \
            zornov-linux sh -c 'cargo test --release --workspace && cargo xtask assets-check && cargo xtask package-linux'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zornov-Linux
          path: dist/*.tar.gz

  clippy:
    # Clippy on its own runner, beside the Linux tests rather than before
    # them. It fails on its errors only; its warnings are being fixed over time
    # and do not fail the build. clippy.toml allows unwrap, expect and panic in
    # tests. A check build is small, so it has its own cache.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Build the image
        run: docker build -t zornov-linux docker
      - name: Clippy
        run: |
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/cache/home -e CARGO_TARGET_DIR=/work/target \
            -e CARGO_INCREMENTAL -e CARGO_PROFILE_DEV_DEBUG -e CARGO_PROFILE_TEST_DEBUG -e CARGO_TERM_COLOR \
            -v "$PWD:/work" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cargo/git:/usr/local/cargo/git" \
            zornov-linux cargo clippy --workspace --all-targets

  ci-ok:
    # The one required check: green when every job above passed or was skipped
    # on purpose (documentation only). A cancelled run was replaced by a newer
    # one, so it warns instead of failing.
    needs: [changes, deny, workflows, assets, windows, linux, clippy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -I -B -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = [n for n, j in needs.items() if j["result"] == "failure"]
          gone = [n for n, j in needs.items() if j["result"] == "cancelled"]
          for n, j in needs.items(): print(n + ": " + j["result"])
          if gone: print("::warning::cancelled: " + ", ".join(gone))
          if bad: print("::error::failed: " + ", ".join(bad)); sys.exit(1)
          '
